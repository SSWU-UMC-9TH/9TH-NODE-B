name: deploy-durian  # 파이프라인 이름은 자유롭게 지어주세요

on:
  push:
    branches:
      - Week10/#30  # main 브랜치에 새로운 커밋이 올라왔을 떄 실행되도록 합니다
  workflow_dispatch:  # 필요한 경우 수동으로 실행할 수도 있도록 합니다

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prisma 폴더가 변경되었는지 감지하는 단계 
      - name: Check prisma has changes
        uses: dorny/paths-filter@v3
        id: paths-filter
        with:
          filters: |
            prisma: ["prisma/**"]

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 접속 별명 설정
          cat >>~/.ssh/config <<END
          Host umc9thworkbook
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          END
        env:
          EC2_USER: ubuntu
          EC2_HOST: ${{ secrets.EC2_HOST_DURIAN }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY_DURIAN }}

      - name: Copy Workspace
        run: |
          ssh umc9thworkbook 'sudo mkdir -p /opt/app'
          ssh umc9thworkbook 'sudo chown ubuntu:ubuntu /opt/app'
          scp -r ./[!.]* umc9thworkbook:/opt/app

      - name: Install dependencies
        run: |
          ssh umc9thworkbook 'cd /opt/app; npm install'
          ssh umc9thworkbook 'cd /opt/app; npx prisma generate'

      - name: Apply prisma migrations
        if: steps.paths-filter.outputs.prisma == 'true'
        run: |
          ssh umc9thworkbook 'cd /opt/app; npx prisma migrate deploy'

      - name: Restart PM2
        run: |
          ssh umc9thworkbook 'cd /opt/app; pm2 reload ecosystem.config.cjs --env production --update-env'